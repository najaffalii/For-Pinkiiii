<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinkiiii 💖</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    background:linear-gradient(-45deg,#ff4d88,#ff66b2,#ff99cc,#ff3385);
    background-size:400% 400%;
    animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.screen{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:1s;
    padding:20px;
}

.hidden{
    opacity:0;
    pointer-events:none;
    transform:scale(1.2);
}

h1{
    color:white;
    font-size:4rem;
    text-align:center;
    text-shadow:0 0 20px white;
    animation:float 3s ease-in-out infinite;
}

p{
    color:white;
    font-size:1.8rem;
    margin-top:20px;
    text-align:center;
    line-height:1.6;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-15px);
    }
}

.btn{
    margin-top:35px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    font-size:1.2rem;
    cursor:pointer;
    transition:0.4s;
    font-weight:bold;
    background:white;
    color:#ff3385;
    box-shadow:0 0 20px rgba(255,255,255,0.5);
}

.btn:hover{
    transform:scale(1.1);
}

.buttons{
    display:flex;
    gap:20px;
    margin-top:30px;
    position:relative;
}

#noBtn{
    position:relative;
}

/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-50px;
    font-size:25px;
    color:white;
    animation:rise 8s linear infinite;
    opacity:0.8;
}

@keyframes rise{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) rotate(360deg);
        opacity:0;
    }
}

/* Final Animation */

.final-message{
    animation:zoomIn 2s ease;
}

@keyframes zoomIn{
    from{
        transform:scale(0);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.sparkle{
    position:absolute;
    width:10px;
    height:10px;
    background:white;
    border-radius:50%;
    animation:spark 3s linear infinite;
}

@keyframes spark{
    from{
        transform:translateY(0) scale(0);
        opacity:1;
    }

    to{
        transform:translateY(-800px) scale(2);
        opacity:0;
    }
}

/* Mobile Responsive */

@media(max-width:768px){

    h1{
        font-size:2.7rem;
    }

    p{
        font-size:1.3rem;
    }

    .btn{
        padding:12px 25px;
        font-size:1rem;
    }
}

</style>
</head>

<body>

<!-- Floating Hearts -->

<div class="heart" style="left:10%; animation-duration:6s;">💖</div>
<div class="heart" style="left:25%; animation-duration:8s;">💕</div>
<div class="heart" style="left:40%; animation-duration:7s;">💘</div>
<div class="heart" style="left:60%; animation-duration:9s;">💗</div>
<div class="heart" style="left:75%; animation-duration:6s;">💞</div>
<div class="heart" style="left:90%; animation-duration:10s;">❤️</div>

<!-- SCREEN 1 -->

<div class="screen" id="screen1">

    <h1>Pinkiiii 💖</h1>

    <p>
        I Like You So Much ✨
    </p>

    <button class="btn" onclick="nextScreen1()">
        Click Me 💌
    </button>

</div>

<!-- SCREEN 2 -->

<div class="screen hidden" id="screen2">

    <h1>Pinkiiii 💖</h1>

    <p>
        You Make My World Beautiful ✨
    </p>

    <button class="btn" onclick="nextScreen2()">
        Continue 🌸
    </button>

</div>

<!-- SCREEN 3 -->

<div class="screen hidden" id="screen3">

    <h1>Do You Like Me? 🌸</h1>

    <div class="buttons">

        <button class="btn" onclick="yesClicked()">
            Yes 💖
        </button>

        <button class="btn" id="noBtn">
            No 😅
        </button>

    </div>

</div>

<!-- SCREEN 4 -->

<div class="screen hidden" id="screen4">

    <div class="final-message">

        <h1>Yayyyyy ✨💖</h1>

        <p>
            You Just Made This Moment Special 🌸<br><br>

            Endless Smiles, Cute Moments,<br>
            And Beautiful Memories Ahead ✨<br><br>

            Hope This Little Surprise Made You Smile 💖
        </p>

    </div>

</div>

<script>

/* Screen Transitions */

function nextScreen1(){

    document.getElementById("screen1").classList.add("hidden");
    document.getElementById("screen2").classList.remove("hidden");
}

function nextScreen2(){

    document.getElementById("screen2").classList.add("hidden");
    document.getElementById("screen3").classList.remove("hidden");
}

function yesClicked(){

    document.getElementById("screen3").classList.add("hidden");
    document.getElementById("screen4").classList.remove("hidden");

    createSparkles();
}

/* No Button Escapes */

const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("mouseover", () => {

    const x = Math.floor(Math.random() * 300) - 150;
    const y = Math.floor(Math.random() * 300) - 150;

    noBtn.style.transform = `translate(${x}px, ${y}px)`;
});

/* Sparkles Animation */

function createSparkles(){

    for(let i = 0; i < 80; i++){

        const sparkle = document.createElement("div");

        sparkle.classList.add("sparkle");

        sparkle.style.left =
        Math.random() * window.innerWidth + "px";

        sparkle.style.top =
        Math.random() * window.innerHeight + "px";

        sparkle.style.animationDuration =
        (Math.random() * 3 + 2) + "s";

        document.body.appendChild(sparkle);

        setTimeout(()=>{
            sparkle.remove();
        },4000);
    }
}

</script>

</body>
</html>
